<div class="weave-metric">
  <div class="weave-metric__label">{{ props.label }}</div>

  <div class="weave-metric__row">
    <span class="weave-metric__value">{{ text() }}</span>
    @if (props.unit) {
      <span class="weave-metric__unit">{{ props.unit }}</span>
    }
    @if (hasDelta()) {
      <span class={{ toneClass() }}>
        <span class="weave-metric__arrow" aria-hidden="true">{{ arrow() }}</span>
        {{ deltaText() }}
      </span>
    }
  </div>

  @if (props.deltaLabel && hasDelta()) {
    <div class="weave-metric__note">{{ props.deltaLabel }}</div>
  }

  @let done = progress();
  @if (done !== null) {
    <div class="weave-metric__track" role="progressbar"
         aria-valuenow={{ percent() }} aria-valuemin={{ 0 }} aria-valuemax={{ 100 }}
         aria-label={{ props.label }}>
      <div class="weave-metric__fill" style={{ 'width:' + percent() + '%' }}></div>
    </div>
    <div class="weave-metric__note">{{ progressText() }}</div>
  }

  @if (hasSpark()) {
    <div class="weave-metric__spark">
      <Chart sparkline data={{ props.data }} x={{ props.x ?? props.y }} series={{ sparkSeries() }}
             height={{ props.sparkHeight ?? 40 }} />
    </div>
  }
</div>

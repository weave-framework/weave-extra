# pnpm 11 reads install policy here, not from package.json.
#
# esbuild ships a platform binary via a postinstall script and `@weave-framework/cli` needs it, so its
# build is approved. `@parcel/watcher` is a transitive of `sass` used only by its `--watch` CLI — we
# compile through the sass API, so its native build is denied rather than left merely unapproved.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - '@weave-framework/check@2.2.0'
  - '@weave-framework/cli@2.2.0'
  - '@weave-framework/compiler@2.2.0'
  - '@weave-framework/mcp@2.2.0'
  - '@weave-framework/router@2.2.0'
  - '@weave-framework/runtime@2.2.0'
  - '@weave-framework/ui@2.2.0'
  - '@weave-framework/check@3.0.0'
  - '@weave-framework/cli@3.0.0'
  - '@weave-framework/compiler@3.0.0'
  - '@weave-framework/mcp@3.0.0'
  - '@weave-framework/router@3.0.0'
  - '@weave-framework/runtime@3.0.0'
  - '@weave-framework/ui@3.0.0'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the authorship gate scans commit messages not yet on the remote, which needs
      # `origin/main` to exist as a ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authorship gate
        run: pnpm run verify:authorship

      - name: Typecheck
        run: pnpm run typecheck

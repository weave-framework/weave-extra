<Toolbar sticky={{ true }} class="topbar">
  <Button variant="icon" label="Toggle navigation" on:click={{ toggleNav }}>
    <Icon name="menu" />
  </Button>

  <a class="brand" href="#">
    <span>Weave</span>
    <Badge variant="tag">extra</Badge>
  </a>

  <span class="weave-toolbar__spacer"></span>

  <Button variant="icon" label="Toggle color theme" on:click={{ toggleTheme }}>
    <Icon name={{ themeIcon() }} />
  </Button>

  <Button variant="icon" label="Open the repository on GitHub" on:click={{ openRepo }}>
    <Icon name="git-branch" />
  </Button>
</Toolbar>

<Sidenav class="layout" api={{ setNavApi }}>
  <nav slot="drawer" class="sidebar" aria-label="Examples">
    <Expansion class="sidebar-nav" panels={{ panels() }} defaultOpen={{ openIds() }} headingLevel={{ 2 }} />
  </nav>

  <main class="content">
    @switch (current()) {
      @case ('split') { <SplitPage /> }
      @case ('inside') { <InsidePage /> }
      @case ('docking') { <DockingPage /> }
      @case ('table') { <TablePage /> }
      @case ('bench') { <BenchPage /> }
      @default { <p>Nothing selected.</p> }
    }
  </main>
</Sidenav>

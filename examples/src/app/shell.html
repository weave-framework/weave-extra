<Toolbar sticky={{ true }} class="ex-topbar">
  <Button variant="icon" label="Toggle navigation" class="ex-topbar__toggle" on:click={{ toggleNav }}>
    <Icon name="menu" />
  </Button>

  <a class="ex-brand" href="#">
    <span class="ex-brand__name">Weave</span>
    <Badge variant="tag" class="ex-brand__tag">extra</Badge>
  </a>

  <span class="weave-toolbar__spacer"></span>

  <Button variant="icon" label="Toggle color theme" on:click={{ toggleTheme }}>
    <Icon name={{ themeIcon() }} />
  </Button>

  <Button variant="icon" label="Open the repository on GitHub" on:click={{ openRepo }}>
    <Icon name="git-branch" />
  </Button>
</Toolbar>

<Sidenav class="ex-layout" api={{ setNavApi }}>
  <nav slot="drawer" class="ex-sidebar" aria-label="Examples">
    <Expansion class="ex-nav" panels={{ panels() }} defaultOpen={{ openIds() }} headingLevel={{ 2 }} />
  </nav>

  <main class="ex-content">
    @switch (current()) {
      @case ('split') { <SplitPage /> }
      @case ('inside') { <InsidePage /> }
      @case ('docking') { <DockingPage /> }
      @default { <p class="ex-empty">Nothing selected.</p> }
    }
  </main>
</Sidenav>

<div class="ex-shell">
  <aside class="ex-nav">
    <header class="ex-nav__head">
      <h1 class="ex-nav__title">Weave <em>Extra</em></h1>
      <p class="ex-nav__sub">Live examples</p>
    </header>

    @for (group of groups(); track group.name) {
      <section class="ex-nav__group">
        <h2 class="ex-nav__group-title">{{ group.name }}</h2>
        <List
          items={{ group.items }}
          value={{ current() }}
          onChange={{ go }}
          label={{ group.name }}
          class="ex-nav__list"
        />
      </section>
    }

    <footer class="ex-nav__foot">
      <a href="https://github.com/weave-framework/weave-extra">weave-framework/weave-extra</a>
    </footer>
  </aside>

  <main class="ex-main">
    @switch (current()) {
      @case ('split') { <SplitPage /> }
      @case ('inside') { <InsidePage /> }
      @case ('docking') { <DockingPage /> }
      @default { <p class="ex-empty">Nothing selected.</p> }
    }
  </main>
</div>

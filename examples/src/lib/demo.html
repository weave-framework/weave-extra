<section class="ex-demo">
  <h3 class="ex-demo__title">{{ props.title }}</h3>
  @if (props.note) {
    <p class="ex-demo__note">{{ props.note }}</p>
  }
  <Card class="ex-demo__card">
    <span class="ex-demo__label">Live</span>
    <div class="ex-demo__stage" style={{ stageStyle() }}>
      <slot />
    </div>
  </Card>
  @if (props.snippet) {
    <Code id={{ props.snippet }} />
  }
</section>
